---
configuration:
  API_KEY:
    name: Gateway API Key
    description: >-
      Bearer key for the gateway API and panel login. Leave empty to
      auto-generate one on first start (printed in the log, saved to
      /config/workbuddy2api-panel/api_key.txt, and backfilled into this
      option). Change this option and restart to apply; leave empty to manage
      the key in the panel.
  TZ:
    name: Timezone
    description: >-
      Container timezone; controls when scheduled tasks (check-in, activity,
      keep-alive) run.
network:
  7863/tcp: API / web panel port
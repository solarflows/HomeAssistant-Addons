---
name: 青龙面板 for HA
slug: qinglong
version: "2.24.0-build.14"
image: ghcr.io/solarflows/qinglong
description: "支持 Python3、JavaScript、Shell、Typescript 的定时任务管理平台"
url: https://github.com/whyour/qinglong
init: false
arch:
  - aarch64
  - amd64
webui: "http://[HOST]:[PORT:5700]/"
ports:
  5700/tcp: 5700
ports_description:
  5700/tcp: "Web UI port"
map:
  - type: app_config
    path: /ql/data
    read_only: false
  - type: homeassistant_config
    path: /legacy_ha
    read_only: false
  - type: share
    path: /share
    read_only: false
startup: application
boot: manual
ingress: true
ingress_port: 5700

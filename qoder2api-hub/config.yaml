name: "Qoder2API Hub"
version: "1.9.8-build.2"
slug: "qoder2api-hub"
image: "ghcr.io/solarflows/qoder2api-hub"
description: "Qoder 多账号池化反代网关与管理面板（OpenAI & Anthropic 兼容，支持 CN/Intl 双区、会话缓存与 UMID 指纹）"
url: "https://github.com/solarflows/HomeAssistant-Addons/tree/main/qoder2api-hub"
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ports:
  8790/tcp: 8790
ports_description:
  8790/tcp: "OpenAI / Anthropic 兼容 API 与管理面板端口"
webui: "[PROTO:http]://[HOST]:[PORT:8790]"
map:
  - type: app_config
    path: /app/accounts
    read_only: false
  - type: homeassistant_config
    path: /legacy_ha
    read_only: false
# 环境变量策略：未设置或留空保持 unset（由上游默认/Web 面板接管）；仅必要项在 options 预置默认值
options:
  API_KEY: ""
  PANEL_PASSWORD: ""
  TZ: "Asia/Shanghai" # 预置默认值：容器运行与日志时区
  QD_CN_VPC_ENDPOINT: ""
  HTTPS_PROXY: ""
schema:
  API_KEY: "password?"
  PANEL_PASSWORD: "password?"
  TZ: "str?"
  QD_CN_VPC_ENDPOINT: "str?"
  HTTPS_PROXY: "str?"
  # 可选高级覆盖项（默认 unset，交由上游内置默认值/面板配置；需要时在 HA UI「显示未使用的可选配置项」或 YAML 中填写）
  QD_PROXY_DEFAULT_REALM: "list(cn|intl)?"
  QD_SESSION_CACHE: "list(off|memory|redis)?"
  QD_ANTHROPIC_THINKING: "list(off|empty)?"

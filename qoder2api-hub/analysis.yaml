# analysis.yaml — qoder2api-hub addon upstream analysis
# https://github.com/solarflows/HomeAssistant-Addons/.github/skills/plan-addon
# 证据: 上游源码 Dockerfile / start-qoder-proxy-lan.sh / stop-qoder-proxy.sh /
#       qoder_proxy.py / qoder_logpaths.py / qoder_updater.py / _install_umid.py 实测
---
upstream:
  repo: shuishuipingan/qoder2api-hub
  description: >-
    Qoder 多账号池化反代网关与管理面板（OpenAI + Anthropic /v1/messages 兼容、
    CN/Intl 双区、Anthropic thinking 策略、会话缓存、UMID 原生身份识别与 Pillow 图像支持）。
  license: MIT

build:
  strategy: source
  base_image: ghcr.io/hassio-addons/debian-base:9.3.0
  source_tag: "v${version}"       # GitHub Release tag 带 v 前缀（如 v1.9.8）
  image_archs: [amd64, arm64]
  stage1_artifacts:
    - /app/umid/runtime-info      # 构建期运行 _install_umid.py 从 npm @qoder-ai/qodercli 解出原生 ELF
  runtime_apt:
    - python3
    - python3-pil                 # Debian Trixie Pillow，对应上游 Dockerfile Pillow 图像编码能力
    - curl
    - tzdata
    - ca-certificates
    - procps

runtime:
  language: python
  supervisor: s6-overlay
  services:
    - name: qoder2api-hub
      type: longrun
      command: "exec /app/start-qoder-proxy-lan.sh 8790 (设 PANEL_PASSWORD 时直接 exec python3 /app/qoder_proxy.py --port 8790 --lan --panel-password ...)"
      notes: >-
        上游 start-qoder-proxy-lan.sh 原生使用 exec "$PYEXE" "$SCRIPT" --port "$PORT" --lan，
        与 S6 longrun 完美契合。关于自更新：qoder_updater.py 在 _in_container() 下有意禁用了
        容器内原地替换，且 schedule_restart() 采用 Popen 新进程 + os._exit(0) 会与 S6 监督拉起产生
        8790 端口冲突；故保留 /update/check 发现更新提示，版本升级交由 HA Store + CI 镜像重建托管。
  working_dir: /app

network:
  port: 8790
  protocol: tcp
  health: "http://127.0.0.1:8790/ping"
  ingress: false   # dashboard.html 大量使用根目录绝对路径 fetch('/credits/probe' / '/panel/*' / '/admin/routing')

filesystem:
  persistent_dirs:
    - container: /app/accounts
      ha: /addon_configs/qoder2api-hub
      type: app_config_mount
      reason: 账号凭据（*.json）、settings.json、machine_identity.json、scheduler/ 等高价值状态，随 HA 备份。
    - container: /legacy_ha
      ha: /homeassistant
      type: homeassistant_config_mount
      reason: 仅用于迁移检查（若存在 /legacy_ha/qoder2api-hub 且 /app/accounts 为空则迁入）。
    - container: /data/logs
      ha: /data/logs
      type: data_dir
      reason: 网关日志（QD_LOG_DIR），不随 HA 备份。
    - container: /data/usage
      ha: /data/usage
      type: data_dir
      reason: 用量统计与汇总缓存（QD_PROXY_USAGE_DIR），避免撑大 HA 备份。

assets:
  icon: "官方 Qoder 图标 PNG (412x412 alicdn / favIcon.svg) 缩放为 256x256 PNG"

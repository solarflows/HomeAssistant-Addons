---
configuration:
  API_KEY:
    name: API Key
    description: >-
      Bearer API key for OpenAI / Anthropic client access. When empty on first
      start, extracts the existing active key (ha-option or first enabled entry
      in api_keys, or api_key / launcher_key) or generates a random wb-... key
      and backfills this option. In multi-key mode, changing this value only
      upserts the "ha-option" entry without overwriting other dashboard keys.
  PANEL_PASSWORD:
    name: Panel Password
    description: >-
      Web dashboard login password (upstream default is "admin"). Applied to
      settings.json only when changed so in-panel password updates survive
      restarts.
  TZ:
    name: Timezone
    description: Container timezone (e.g. Asia/Shanghai, UTC).
  WB_PROXY_DEFAULT_REALM:
    name: Default Realm
    description: >-
      Default upstream realm selected on startup: intl (workbuddy.ai) or cn
      (copilot.tencent.com / codebuddy.cn).
  WB_TLS_FINGERPRINT:
    name: TLS Fingerprint Mode
    description: >-
      Outbound TLS fingerprint engine: auto (prefer bundled Go uTLS bridge,
      fallback on unsupported env), python (stdlib SSL), or node.
  WB_ENABLE_ANTHROPIC_MESSAGES:
    name: Enable Anthropic /v1/messages Endpoint
    description: >-
      Expose Anthropic-compatible /v1/messages endpoint for Claude Code and
      compatible clients.
  HTTPS_PROXY:
    name: Outbound HTTPS Proxy
    description: >-
      Optional outbound proxy URL for upstream requests (e.g.
      http://192.168.1.2:7890). Leave empty for direct connection.
network:
  8788/tcp: OpenAI / Anthropic compatible API gateway and management panel

---
configuration:
  API_KEY:
    name: API Key
    description: >-
      Bearer API key for OpenAI / Anthropic client access. Left empty by default
      to be managed autonomously via the Web dashboard. When configured, it is
      synced into settings.json without overwriting other dashboard keys.
  WB_PROXY_DEFAULT_REALM:
    name: Default Realm (Optional Override)
    description: >-
      Default unset (upstream defaults to intl). Optionally override the initial
      startup realm: intl (workbuddy.ai) or cn (copilot.tencent.com / codebuddy.cn).
  WB_TLS_FINGERPRINT:
    name: TLS Fingerprint Mode (Optional Override)
    description: >-
      Default unset (upstream defaults to auto). Optionally choose auto (prefer
      bundled Go uTLS bridge with fallback), python (stdlib SSL), or node.
  WB_ENABLE_ANTHROPIC_MESSAGES:
    name: Enable Anthropic /v1/messages Endpoint
    description: >-
      Expose Anthropic-compatible /v1/messages endpoint for Claude Code and
      compatible clients.
  HTTPS_PROXY:
    name: Outbound HTTPS Proxy
    description: >-
      Optional outbound proxy URL for upstream requests (e.g.
      http://192.168.1.2:7890). Leave empty for direct connection.
network:
  8788/tcp: OpenAI / Anthropic compatible API gateway and management panel

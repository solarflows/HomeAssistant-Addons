---
configuration:
  API_KEY:
    name: API 密钥
    description: >-
      OpenAI / Anthropic 客户端接入所需的 Bearer Key。留空时完全由 Web 管理面板
      自治管理；若在此显式配置，初始化脚本将同步写入 settings.json（多 Key 模式下
      仅新增或更新 id="ha-option" 条目，不会破坏面板自建的其它分域/限模型 Key）。
  WB_PROXY_DEFAULT_REALM:
    name: 默认服务区（可选覆盖）
    description: >-
      默认不设置（unset，上游默认 intl）。如需覆盖启动初始区域可选 intl（国际版 WorkBuddy）
      或 cn（国内版 CodeBuddy）。
  WB_TLS_FINGERPRINT:
    name: TLS 指纹引擎（可选覆盖）
    description: >-
      默认不设置（unset，上游默认 auto）。可选 auto（优先内置 Go uTLS 桥接，异常时自动回退）、
      python（Python 原生 TLS）或 node。
  WB_ENABLE_ANTHROPIC_MESSAGES:
    name: 启用 Anthropic /v1/messages 接口
    description: 开启 Anthropic Messages 兼容端点，便于 Claude Code 等客户端直接接入。
  HTTPS_PROXY:
    name: 出站 HTTPS 代理
    description: >-
      可选上游出站代理地址（例如 http://192.168.1.2:7890）；直连请留空。
network:
  8788/tcp: OpenAI / Anthropic 兼容网关与 Web 管理面板端口

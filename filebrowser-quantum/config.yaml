name: FileBrowser Quantum
slug: filebrowser-quantum
version: "2.1.0-stable"
image: ghcr.io/solarflows/filebrowser-quantum
description: "现代化 Web 文件管理器，支持多存储源挂载、在线媒体预览与细粒度权限认证"
url: https://github.com/gtsteffaniak/filebrowser
init: false
arch:
  - aarch64
  - amd64
webui: "[PROTO:http]://[HOST]:[PORT:8080]"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: 'FileBrowser Quantum Web UI port'
map:
  - type: app_config
    path: /config
    read_only: false
  - type: all_app_configs
    path: /app_configs
    read_only: false
  - type: homeassistant_config
    path: /homeassistant
    read_only: false
  - type: share
    path: /share
    read_only: false
  - type: media
    path: /media
    read_only: false
  - type: ssl
    path: /ssl
    read_only: true
startup: application
boot: manual
options:
  auth_method: password
  default_user_scope: /
schema:
  auth_method: list(password|noauth|proxy|oidc)
  default_user_scope: str

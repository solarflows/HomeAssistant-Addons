name: FileBrowser Quantum
slug: filebrowser-quantum
version: "2.0.2-stable-build.8"
image: ghcr.io/solarflows/filebrowser-quantum
description: "Modern, responsive web-based file manager with multi-source support and advanced authentication"
url: https://github.com/gtsteffaniak/filebrowser
init: false
arch:
  - aarch64
  - amd64
webui: "[PROTO:http]://[HOST]:[PORT:8080]"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: 'FileBrowser Quantum Web UI port'
map:
  - type: app_config
    path: /config
    read_only: false
  - type: all_app_configs
    path: /app_configs
    read_only: false
  - type: homeassistant_config
    path: /homeassistant
    read_only: false
  - type: share
    path: /share
    read_only: false
  - type: media
    path: /media
    read_only: false
  - type: ssl
    path: /ssl
    read_only: true
startup: application
boot: manual
options:
  auth_method: password
  default_user_scope: /
schema:
  auth_method: list(password|noauth|proxy|oidc)
  default_user_scope: str

name: Lucky(万吉)
slug: lucky
version: "3.5.0-build.7"
image: ghcr.io/solarflows/lucky
description: "替代socat,IPv6 tcp/udp 转发内网IPv4,动态域名服务"
url: https://github.com/gdy666/lucky
webui: "[PROTO:http]://[HOST]:[PORT:16601]"
init: false
startup: application
boot: manual
arch:
  - aarch64
  - amd64
ports:
  16601/tcp: 16601
ports_description:
  16601/tcp: "Lucky Web UI port"
ingress: true
ingress_port: 16601
icon: "mdi:server-network"
host_network: true
map:
  - type: app_config
    path: /goodluck
    read_only: false
  - type: homeassistant_config
    path: /legacy_ha
    read_only: false
  - type: ssl
    path: /ssl
    read_only: true

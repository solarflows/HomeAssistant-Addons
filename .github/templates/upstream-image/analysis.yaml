# analysis.yaml — filled by plan-addon skill
# https://github.com/solarflows/HomeAssistant-Addons/.github/skills/plan-addon
---
upstream:
  repo: owner/repo
  description: 服务功能简述
  license: MIT

build:
  strategy: upstream-image       # upstream-image | binary-download | multi-stage | release-jar
  builder_image: owner/repo:latest
  version_arg: UPSTREAM_VERSION

runtime:
  language: binary
  entrypoint: /ha-entrypoint.sh
  working_dir: /
  env: {}
  data_dir: /app/data

network:
  port: 8080
  protocol: tcp

lifecycle:
  init_mode: offline_only        # 纯本地离线播种，严禁公网网络下载
  topology: upstream_entrypoint  # 无 S6，由 dumb-init 与 ha-entrypoint.sh 纳管

healthcheck:
  type: http                     # http | dual_http | tcp
  endpoint: /health              # 优先免鉴权端点 (如 /health, /healthz, /ping, /status)
  port: 8080
  start_period: 45s              # 官方镜像启动预热
  timeout: 5s
  interval: 30s
  retries: 3
  command: "curl -sfo /dev/null --noproxy '*' --max-time 5 \"http://127.0.0.1:8080/health\" || exit 1"

filesystem:
  persistent_dirs:
    - container: /app/data
      ha: app_config
      type: direct_mount
      read_only: false
      reason: Upstream data directory
  hardcoded_paths: []
  cwd_matters: false

config:
  options: {}
  schema: {}

adaptations:
  - 继承上游优化镜像，注入 dumb-init 与 ha-entrypoint 适配层
  - 采用 app_config 原生直挂持久化，零软链架构
  - Healthcheck 绑定免鉴权探活路由，强制注入 --noproxy '*'

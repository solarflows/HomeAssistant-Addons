name: Version Check

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all addons (ignore version check)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  push:
    branches:
      - main
    paths:
      - '**/Dockerfile'
      - '**/rootfs/**'
      - '.github/workflows/Release.yml'

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 100

      - name: Detect version changes
        id: detect
        run: |
          MATRIX="[]"
          HAS_CHANGES="false"

          # ============================================================
          # 1. 获取 debian-base 最新 tag
          # ============================================================
          REMOTE_BASE_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/hassio-addons/addon-debian-base/releases/latest" \
            | jq -r '.tag_name // empty')
          [ -z "$REMOTE_BASE_TAG" ] && REMOTE_BASE_TAG="unknown"
          # debian-base tag 为 v9.3.0 格式，统一去 v
          REMOTE_BASE_TAG=$(echo "$REMOTE_BASE_TAG" | sed 's/^v//')
          echo "debian-base remote: $REMOTE_BASE_TAG"

          FORCE_REBUILD="${{ inputs.force_rebuild || 'false' }}"
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "=== Force rebuild enabled ==="
          fi

          # ============================================================
          # 2. 检测文件变更（push / cron / dispatch）
          # ============================================================
          CHANGED_FILES=""
          COMMIT_MSG=""

          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} 2>/dev/null || echo "")
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            echo "=== Push event: diff ${{ github.event.before }}..${{ github.event.after }} ==="
            # 兜底：fetch-depth 不足或 before SHA 无效时，扫描最近 10 个 commit
            if [ -z "$CHANGED_FILES" ]; then
              echo "=== Diff returned empty, falling back to git log ==="
              CHANGED_FILES=$(git log --name-only --format="" -10 2>/dev/null | sort -u | sed '/^$/d')
            fi
          else
            # 从任意一个 addon 的 tracking.file_sha 取上次检查点
            LAST_SHA=""
            for vf in */version.yaml; do
              [ -f "$vf" ] || continue
              LAST_SHA=$(yq eval '.tracking.file_sha // ""' "$vf")
              [ -n "$LAST_SHA" ] && break
            done
            if [ -n "$LAST_SHA" ]; then
              CHANGED_FILES=$(git diff --name-only "$LAST_SHA" HEAD 2>/dev/null || echo "")
              # 过滤掉仅由 CI bot 修改的文件（避免 CI 自触发的 config.yaml 循环重建）
              if [ -n "$CHANGED_FILES" ] && [ -n "$LAST_SHA" ]; then
                FILTERED=""
                for f in $CHANGED_FILES; do
                  BOT_ONLY=true
                  for c in $(git log --pretty=format:"%H" "$LAST_SHA..HEAD" -- "$f" 2>/dev/null); do
                    author=$(git log -1 --pretty=format:"%an" "$c" 2>/dev/null)
                    if [ "$author" != "github-actions[bot]" ]; then
                      BOT_ONLY=false; break
                    fi
                  done
                  if [ "$BOT_ONLY" = "false" ]; then
                    FILTERED="$FILTERED $f"
                  else
                    echo "  [bot filter] Skipping CI-only change: $f"
                  fi
                done
                CHANGED_FILES="$FILTERED"
              fi
              echo "=== Cron/dispatch: diff $LAST_SHA..HEAD ==="
            else
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
              echo "=== First run: diff HEAD~1..HEAD ==="
            fi
            COMMIT_MSG=$(git log -1 --pretty=format:"%s" 2>/dev/null || echo "")
          fi

          # ============================================================
          # 3. 遍历 addon，检测上游版本和底包变更
          # ============================================================
          declare -A ADDON_MATRIX
          declare -A ADDON_REASON
          declare -A ADDON_REMOTE_VERSION

          for version_file in */version.yaml; do
            [ -f "$version_file" ] || continue
            ADDON_DIR=$(dirname "$version_file")
            SOURCE=$(yq eval '.source' "$version_file")
            REPO=$(yq eval '.repo' "$version_file")

            VERSION=$(yq eval '.version // ""' "$version_file")
            [ -z "$VERSION" ] && continue

            echo "Checking $ADDON_DIR: local=$VERSION"

            # --- 获取远程版本 ---
            if [ "$SOURCE" = "github_tags" ]; then
              REMOTE_TAG=$(curl -fsSL "https://api.github.com/repos/${REPO}/tags?per_page=1" \
                | jq -r '.[0].name // empty' | head -1)
            else
              REMOTE_TAG=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" \
                | jq -r '.tag_name // empty')
            fi
            [ -z "$REMOTE_TAG" ] && { echo "  Failed to get remote version, skipping"; continue; }

            # 统一去除 v 前缀
            REMOTE_VERSION=$(echo "$REMOTE_TAG" | sed 's/^v//')
            echo "  Remote: $REMOTE_VERSION"

            # --- 判断 reason ---
            REASON=""
            FILE_SHA=$(yq eval '.tracking.file_sha // ""' "$version_file")
            if [ "$FORCE_REBUILD" = "true" ]; then
              REASON="force_rebuild"
              echo "  Force rebuild"
            elif [ -z "$FILE_SHA" ] || [ "$FILE_SHA" = "null" ]; then
              # 首次构建：tracking 为空代表新 addon 从未被构建过
              REASON="version_changed"
              echo "  First build detected (empty tracking)"
            elif [ "$REMOTE_VERSION" != "$VERSION" ]; then
              REASON="version_changed"
              echo "  New version detected!"
            else
              # 检查底包更新（仅 debian-base 系 addon）
              ADDON_BASE_TAG=$(yq eval '.tracking.base_tag // ""' "$version_file")
              if [ -n "$ADDON_BASE_TAG" ] && [ "$ADDON_BASE_TAG" != "$REMOTE_BASE_TAG" ] && [ "$REMOTE_BASE_TAG" != "unknown" ]; then
                REASON="base_updated"
                echo "  Base image: $ADDON_BASE_TAG → $REMOTE_BASE_TAG"
              fi
            fi

            if [ -n "$REASON" ]; then
              HAS_CHANGES="true"
              ADDON_MATRIX["$ADDON_DIR"]="$ADDON_DIR"
              ADDON_REASON["$ADDON_DIR"]="$REASON"
              ADDON_REMOTE_VERSION["$ADDON_DIR"]="$REMOTE_VERSION"
            else
              echo "  Version unchanged"
            fi
          done

          # ============================================================
          # 4. 匹配文件变更到 addon
          # ============================================================
          if [ -n "$CHANGED_FILES" ]; then
            echo "=== File changes ==="
            echo "$CHANGED_FILES"

            # 检测是否有 Release.yml 变更（构建管道变更才需要全量重建）
            RELEASE_CHANGED=false
            for file in $CHANGED_FILES; do
              if [ "$file" = ".github/workflows/Release.yml" ]; then
                RELEASE_CHANGED=true
                break
              fi
            done

            # Release.yml 变更 → 全量重建（构建管道本身变了）
            if [ "$RELEASE_CHANGED" = "true" ]; then
              echo "  Workflow changed, triggering rebuild for ALL addons"
              for vf in */version.yaml; do
                [ -f "$vf" ] || continue
                ADDON_DIR=$(dirname "$vf")
                if [ -z "${ADDON_MATRIX[$ADDON_DIR]}" ]; then
                  HAS_CHANGES="true"
                  ADDON_MATRIX["$ADDON_DIR"]="$ADDON_DIR"
                  ADDON_REASON["$ADDON_DIR"]="workflow"
                fi
              done
            else
              # 非工作流变更 → 按文件路径匹配到对应 addon，区分子原因
              for file in $CHANGED_FILES; do
                if echo "$file" | grep -qE '^[^/]+/(Dockerfile|rootfs/)'; then
                  ADDON_DIR=$(echo "$file" | cut -d'/' -f1)
                  [ -f "${ADDON_DIR}/version.yaml" ] || continue

                  # 确定子原因（Dockerfile 或 rootfs）
                  case "$file" in
                    */Dockerfile)    TRIG="dockerfile" ;;
                    */rootfs/*)      TRIG="rootfs" ;;
                    *)               continue ;;
                  esac

                  echo "  File change ($TRIG): $file → addon $ADDON_DIR"
                  HAS_CHANGES="true"
                  ADDON_MATRIX["$ADDON_DIR"]="$ADDON_DIR"
                  # 累积不重复的触发原因（如 dockerfile,rootfs）
                  EXISTING="${ADDON_REASON[$ADDON_DIR]:-}"
                  if [ -z "$EXISTING" ]; then
                    ADDON_REASON["$ADDON_DIR"]="$TRIG"
                  elif ! echo "$EXISTING" | grep -q "$TRIG"; then
                    ADDON_REASON["$ADDON_DIR"]="${EXISTING},${TRIG}"
                  fi
                fi
              done
            fi
          fi

          # ============================================================
          # 5. 构建 matrix（精简 3 字段，Release 自行计算其余参数）
          # ============================================================
          # addon   = 目录名
          # reason  = version_changed | base_updated | dockerfile | rootfs | config | workflow | force_rebuild
          # new_ver = 仅 reason=version_changed 时有效的新上游版本号
          for ADDON_DIR in "${!ADDON_MATRIX[@]}"; do
            REASON="${ADDON_REASON[$ADDON_DIR]}"
            NEW_VER="${ADDON_REMOTE_VERSION[$ADDON_DIR]}"

            # 捕获影响该 addon 的 commit message（Release 用于 CHANGELOG）
            ADDON_COMMITS=""
            FILE_SHA=$(yq eval '.tracking.file_sha // ""' "${ADDON_DIR}/version.yaml")
            if [ -n "$FILE_SHA" ] && [ "$FILE_SHA" != "null" ]; then
              ADDON_COMMITS=$(git log --pretty=format:"- %s" "${FILE_SHA}..HEAD" -- "${ADDON_DIR}/" 2>/dev/null || echo "")
            fi
            [ -z "$ADDON_COMMITS" ] && ADDON_COMMITS=$(git log --pretty=format:"- %s" -10 -- "${ADDON_DIR}/" 2>/dev/null || echo "")

            MATRIX=$(echo "$MATRIX" | jq -c \
              --arg addon "$ADDON_DIR" \
              --arg reason "$REASON" \
              --arg new_ver "$NEW_VER" \
              --arg commit_msg "$ADDON_COMMITS" \
              '. + [{addon: $addon, reason: $reason, new_ver: $new_ver, commit_msg: $commit_msg}]')
          done

          RESULT=$(echo "$MATRIX" | jq -c '{include: .}')
          echo "matrix=$RESULT" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "=== Matrix ==="
          echo "$RESULT" | jq .

  trigger-release:
    needs: check-versions
    if: needs.check-versions.outputs.has_changes == 'true'
    uses: ./.github/workflows/Release.yml
    with:
      matrix: ${{ needs.check-versions.outputs.matrix }}
      force_rebuild: ${{ inputs.force_rebuild || false }}
    secrets: inherit

  cleanup-changelog:
    runs-on: ubuntu-latest
    if: always()
    needs: trigger-release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Clean old CHANGELOG entries (>7 days)
        run: |
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%d)
          echo "Cutoff date: $CUTOFF"
          CHANGED=false

          for cl in */CHANGELOG.md; do
            [ -f "$cl" ] || continue
            ADDON_DIR=$(dirname "$cl")
            echo "=== Processing $cl ==="

            # 用 awk 移除日期早于 cutoff 的 changelog 条目
            # 格式: ### version (YYYY-MM-DD)
            awk -v cutoff="$CUTOFF" '
              /^### [^ ]+ \([0-9]{4}-[0-9]{2}-[0-9]{2}\)/ {
                match($0, /\(([0-9]{4}-[0-9]{2}-[0-9]{2})\)/, d)
                if (d[1] < cutoff) { skip=1; next } else { skip=0 }
              }
              skip { next }
              { print }
            ' "$cl" > "${cl}.tmp"

            if ! diff -q "$cl" "${cl}.tmp" >/dev/null 2>&1; then
              mv "${cl}.tmp" "$cl"
              CHANGED=true
              echo "  Cleaned old entries from $cl"
            else
              rm -f "${cl}.tmp"
              echo "  No old entries in $cl"
            fi
          done

          if [ "$CHANGED" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add */CHANGELOG.md
            git commit -m "chore: 清理 >7 天的 CHANGELOG 构建记录" \
                       -m "Cutoff: ${CUTOFF}"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 2
            done
            echo "WARNING: CHANGELOG cleanup push failed after 3 attempts"
          else
            echo "No old CHANGELOG entries to clean."
          fi


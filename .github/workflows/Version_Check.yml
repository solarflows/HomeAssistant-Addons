name: Version Check

on:
  workflow_dispatch:
    inputs:
      addon:
        description: 'Target specific addon to check/build (leave empty for all)'
        required: false
        type: string
        default: ''
      force_rebuild:
        description: 'Force rebuild targeted addon(s) (ignore version check)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  push:
    branches:
      - main
    paths:
      - '**/Dockerfile'
      - '**/rootfs/**'
      - '**/config.yaml'
      - '**/version.yaml'
      - '.github/workflows/Release.yml'
      - '.github/workflows/Version_Check.yml'

# 全局并发互斥锁：同一时刻全仓库只允许一个 Version Check 流程执行，后续触发自动排队等待
# 彻底杜绝定时巡检 (schedule)、代码推送 (push) 或手动触发并发运行，避免多个编译任务抢占 runner 及镜像推送冲突
concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Detect version changes
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          TARGET_ADDON: ${{ inputs.addon || '' }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          MATRIX="[]"
          HAS_CHANGES="false"

          if [ -n "$TARGET_ADDON" ]; then
            echo "=== Targeted addon mode: $TARGET_ADDON ==="
          fi
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "=== Force rebuild enabled ==="
          fi

          # ============================================================
          # 统一版本提取函数: fetch_version(repo, strategy)
          # strategy 支持:
          #   - release (默认/缺省, GitHub latest release tag)
          #   - tags    (最新 Git Tag, 对应 github_tags)
          #   - date    (方案一: 最新 Commit 日期 YYYYMMDD)
          #   - commits (方案二: 主分支总提交数 0.0.N)
          #   - asset   (方案三: 滚动资产最新更新日期 YYYYMMDD)
          # ============================================================
          fetch_version() {
            local repo="$1"
            local strategy="${2:-release}"
            local raw_ver=""

            case "$strategy" in
              github_tags|tags)
                raw_ver=$(curl -fsSL                   -H "Authorization: Bearer $GH_TOKEN"                   "https://api.github.com/repos/${repo}/tags?per_page=1"                   | jq -r '.[0].name // empty' | head -1)
                ;;
              date)
                raw_ver=$(curl -fsSL                   -H "Authorization: Bearer $GH_TOKEN"                   "https://api.github.com/repos/${repo}/commits?per_page=1"                   | jq -r '.[0].commit.committer.date // empty' | cut -c1-10 | tr -d '-')
                ;;
              commits)
                local count
                count=$(curl -fsSLI                   -H "Authorization: Bearer $GH_TOKEN"                   "https://api.github.com/repos/${repo}/commits?per_page=1"                   | grep -i '^link:' | sed -E 's/.*page=([0-9]+)>; rel="last".*/\1/')
                if [ -z "$count" ]; then
                  count=$(curl -fsSL                     -H "Authorization: Bearer $GH_TOKEN"                     "https://api.github.com/repos/${repo}/commits?per_page=100"                     | jq 'length')
                fi
                raw_ver="0.0.${count:-1}"
                ;;
              asset)
                raw_ver=$(curl -fsSL                   -H "Authorization: Bearer $GH_TOKEN"                   "https://api.github.com/repos/${repo}/releases/latest"                   | jq -r '.assets[0].updated_at // empty' | cut -c1-10 | tr -d '-')
                ;;
              github|release|*)
                raw_ver=$(curl -fsSL                   -H "Authorization: Bearer $GH_TOKEN"                   "https://api.github.com/repos/${repo}/releases/latest"                   | jq -r '.tag_name // empty')
                ;;
            esac

            echo "$raw_ver" | sed 's/^[vV]//'
          }

          # ============================================================
          # 1. 获取 debian-base 最新 tag
          # ============================================================
          REMOTE_BASE_TAG=$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/hassio-addons/addon-debian-base/releases/latest"             | jq -r '.tag_name // empty')
          [ -z "$REMOTE_BASE_TAG" ] && REMOTE_BASE_TAG="unknown"
          REMOTE_BASE_TAG=$(echo "$REMOTE_BASE_TAG" | sed 's/^[vV]//')
          echo "debian-base remote: $REMOTE_BASE_TAG"

          # ============================================================
          # 2. 捕获 push 事件的变更文件与跳过标记
          # ============================================================
          CHANGED_FILES=""
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" 2>/dev/null || echo "")
          RELEASE_CHANGED=false

          if [ "$EVENT_NAME" = "push" ]; then
            echo "=== Push event: diff $EVENT_BEFORE..$EVENT_AFTER ==="
            if [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" 2>/dev/null || echo "")
            fi
            if [ -z "$CHANGED_FILES" ]; then
              echo "=== Diff returned empty, falling back to latest commit tree ==="
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null || echo "")
            fi

            if [ -n "$CHANGED_FILES" ]; then
              echo "=== Push changed files ==="
              echo "$CHANGED_FILES"
              for file in $CHANGED_FILES; do
                if [ "$file" = ".github/workflows/Release.yml" ]; then
                  RELEASE_CHANGED=true
                  break
                fi
              done
              if [ "$RELEASE_CHANGED" = "true" ] && echo "$COMMIT_MSG" | grep -qiE '\[skip[-_]?(full[-_]?)?rebuild\]'; then
                echo "=== Release.yml changed, but [skip-rebuild] detected — skipping full rebuild ==="
                RELEASE_CHANGED=false
              fi
            fi
          else
            echo "=== Cron/dispatch event: per-addon tracking.file_sha check ==="
          fi

          # ============================================================
          # 3. 遍历 addon，逐一检测版本、底包与各自独立的文件变更
          # ============================================================
          declare -A ADDON_MATRIX
          declare -A ADDON_REASON
          declare -A ADDON_REMOTE_VERSION
          declare -A ADDON_UPDATED_DEPS

          append_reason() {
            local cur="$1"
            local add="$2"
            if [ -z "$cur" ]; then
              echo "$add"
            elif echo ",${cur}," | grep -q ",${add},"; then
              echo "$cur"
            else
              echo "${cur},${add}"
            fi
          }

          for version_file in */version.yaml; do
            [ -f "$version_file" ] || continue
            ADDON_DIR=$(dirname "$version_file")

            # 若指定了 TARGET_ADDON，跳过其他
            if [ -n "$TARGET_ADDON" ] && [ "$ADDON_DIR" != "$TARGET_ADDON" ]; then
              continue
            fi

            REPO=$(yq eval '.repo' "$version_file")
            STRATEGY=$(yq eval '.strategy // .source // "release"' "$version_file")
            VERSION=$(yq eval '.version // ""' "$version_file")
            [ -z "$VERSION" ] && continue

            echo "Checking $ADDON_DIR (strategy: $STRATEGY): local=$VERSION"

            # --- 获取主仓库远程版本 ---
            REMOTE_VERSION=$(fetch_version "$REPO" "$STRATEGY")
            if [ -z "$REMOTE_VERSION" ]; then
              echo "  Failed to get remote version for $REPO, skipping"
              continue
            fi
            echo "  Remote: $REMOTE_VERSION"

            # --- 检查依赖的副仓库（支持任意 N 个依赖组件，兼容多仓库监控）---
            UPDATED_DEPS="{}"
            DEP_JSON=$(yq eval '.dependencies // {}' -o=json "$version_file" 2>/dev/null || echo "{}")
            BUILD_ARGS_JSON=$(yq eval '.build_args // {}' -o=json "$version_file" 2>/dev/null || echo "{}")
            if [ "$DEP_JSON" != "{}" ] && [ -n "$DEP_JSON" ]; then
              for dep_key in $(echo "$DEP_JSON" | jq -r 'keys[]'); do
                DEP_REPO=$(echo "$DEP_JSON" | jq -r --arg k "$dep_key" '.[$k].repo // empty')
                [ -z "$DEP_REPO" ] && continue
                DEP_STRATEGY=$(echo "$DEP_JSON" | jq -r --arg k "$dep_key" '.[$k].strategy // .[$k].source // "release"')
                DEP_LOCAL_VER=$(echo "$DEP_JSON" | jq -r --arg k "$dep_key" '.[$k].version // empty')
                if [ -z "$DEP_LOCAL_VER" ]; then
                  DEP_LOCAL_VER=$(echo "$BUILD_ARGS_JSON" | jq -r --arg k "$dep_key" '.[$k] // empty')
                fi

                echo "  Checking dependency $dep_key ($DEP_REPO, strategy: $DEP_STRATEGY): local=$DEP_LOCAL_VER"
                DEP_REMOTE_VER=$(fetch_version "$DEP_REPO" "$DEP_STRATEGY")
                if [ -z "$DEP_REMOTE_VER" ]; then
                  echo "    Failed to get remote version for $DEP_REPO, skipping"
                  continue
                fi
                echo "    Remote: $DEP_REMOTE_VER"

                if [ -n "$DEP_LOCAL_VER" ] && [ "$DEP_REMOTE_VER" != "$DEP_LOCAL_VER" ]; then
                  echo "    Dependency $dep_key updated: $DEP_LOCAL_VER -> $DEP_REMOTE_VER"
                  UPDATED_DEPS=$(echo "$UPDATED_DEPS" | jq -c                     --arg k "$dep_key"                     --arg v "$DEP_REMOTE_VER"                     --arg old "$DEP_LOCAL_VER"                     --arg repo "$DEP_REPO"                     '. + {($k): {version: $v, old_version: $old, repo: $repo}}')
                fi
              done
            fi

            # --- 判断版本/底包 reason ---
            REASON=""
            FILE_SHA=$(yq eval '.tracking.file_sha // ""' "$version_file")
            if [ "$FORCE_REBUILD" = "true" ]; then
              REASON="force_rebuild"
              echo "  Force rebuild"
            elif [ -z "$FILE_SHA" ] || [ "$FILE_SHA" = "null" ]; then
              REASON="version_changed"
              echo "  First build detected (empty tracking)"
            elif [ "$REMOTE_VERSION" != "$VERSION" ]; then
              REASON="version_changed"
              echo "  New primary version detected!"
            elif [ "$UPDATED_DEPS" != "{}" ]; then
              REASON="version_changed"
              echo "  Dependency version change detected!"
            else
              ADDON_BASE_TAG=$(yq eval '.tracking.base_tag // ""' "$version_file")
              if [ -n "$ADDON_BASE_TAG" ] && [ "$ADDON_BASE_TAG" != "$REMOTE_BASE_TAG" ] && [ "$REMOTE_BASE_TAG" != "unknown" ]; then
                REASON="base_updated"
                echo "  Base image: $ADDON_BASE_TAG -> $REMOTE_BASE_TAG"
              fi
            fi

            # --- 检测该 addon 自身的构建文件/工作流变更 ---
            if [ "$RELEASE_CHANGED" = "true" ]; then
              if [ -z "$REASON" ]; then
                echo "  Workflow Release.yml changed → addon $ADDON_DIR"
                REASON="workflow"
              fi
            elif [ "$EVENT_NAME" = "push" ]; then
              if [ -n "$CHANGED_FILES" ]; then
                for file in $CHANGED_FILES; do
                  case "$file" in
                    "${ADDON_DIR}/Dockerfile")
                      echo "  Push file change (dockerfile): $file → addon $ADDON_DIR"
                      REASON=$(append_reason "$REASON" "dockerfile")
                      ;;
                    "${ADDON_DIR}/rootfs/"*)
                      echo "  Push file change (rootfs): $file → addon $ADDON_DIR"
                      REASON=$(append_reason "$REASON" "rootfs")
                      ;;
                  esac
                done
              fi
            else
              # Cron / dispatch 模式：严格基于该 addon 自己的 FILE_SHA 检查到 HEAD 的非 bot 修改
              if [ -n "$FILE_SHA" ] && [ "$FILE_SHA" != "null" ] && git cat-file -e "${FILE_SHA}^{commit}" 2>/dev/null; then
                DF_HUMAN=$(git log --format="%an" "${FILE_SHA}..HEAD" -- "${ADDON_DIR}/Dockerfile" 2>/dev/null \
                  | grep -vxE 'github-actions\[bot\]|actions-user' || true)
                if [ -n "$DF_HUMAN" ]; then
                  echo "  Cron/dispatch file change since ${FILE_SHA:0:7} (dockerfile) → addon $ADDON_DIR"
                  REASON=$(append_reason "$REASON" "dockerfile")
                fi
                RF_HUMAN=$(git log --format="%an" "${FILE_SHA}..HEAD" -- "${ADDON_DIR}/rootfs/" 2>/dev/null \
                  | grep -vxE 'github-actions\[bot\]|actions-user' || true)
                if [ -n "$RF_HUMAN" ]; then
                  echo "  Cron/dispatch file change since ${FILE_SHA:0:7} (rootfs) → addon $ADDON_DIR"
                  REASON=$(append_reason "$REASON" "rootfs")
                fi
              fi
            fi

            if [ -n "$REASON" ]; then
              HAS_CHANGES="true"
              ADDON_MATRIX["$ADDON_DIR"]="$ADDON_DIR"
              ADDON_REASON["$ADDON_DIR"]="$REASON"
              ADDON_REMOTE_VERSION["$ADDON_DIR"]="$REMOTE_VERSION"
              ADDON_UPDATED_DEPS["$ADDON_DIR"]="$UPDATED_DEPS"
            else
              echo "  Up to date (version & files unchanged)"
            fi
          done

          # ============================================================
          # 4. 构建 matrix（精简字段，Release 自行计算其余参数）
          # ============================================================
          # addon        = 目录名
          # reason       = version_changed | base_updated | dockerfile | rootfs | config | workflow | force_rebuild
          # new_ver      = 仅 reason=version_changed 时有效的新上游版本号
          # updated_deps = JSON 对象，包含本次检测到更新的依赖副仓库 {KEY: {version, old_version, repo}}
          for ADDON_DIR in "${!ADDON_MATRIX[@]}"; do
            REASON="${ADDON_REASON[$ADDON_DIR]}"
            NEW_VER="${ADDON_REMOTE_VERSION[$ADDON_DIR]:-}"
            UPD_DEPS="${ADDON_UPDATED_DEPS[$ADDON_DIR]:-}"
            [ -z "$UPD_DEPS" ] && UPD_DEPS="{}"

            # 捕获影响该 addon 的 commit message（Release 用于 CHANGELOG）
            # 只取 file_sha..HEAD 范围内该目录的提交，并排除 CI 自动提交
            # （build(...) 与 chore(<addon>): upstream ...）。
            # 绝不回退到全量历史：那会把与本次构建无关的旧提交塞进 CHANGELOG
            # （曾导致"CI 变更"条目列出 9 条历史版本迭代）。
            ADDON_COMMITS=""
            FILE_SHA=$(yq eval '.tracking.file_sha // ""' "${ADDON_DIR}/version.yaml")
            if [ -n "$FILE_SHA" ] && [ "$FILE_SHA" != "null" ]; then
              ADDON_COMMITS=$(git log --pretty=format:"- %s" "${FILE_SHA}..HEAD" -- "${ADDON_DIR}/" 2>/dev/null \
                | grep -vE '^- (build\(|chore\([^)]*\): upstream )' || echo "")
            fi

            MATRIX=$(echo "$MATRIX" | jq -c \
              --arg addon "$ADDON_DIR" \
              --arg reason "$REASON" \
              --arg new_ver "$NEW_VER" \
              --arg commit_msg "$ADDON_COMMITS" \
              --argjson updated_deps "$UPD_DEPS" \
              '. + [{addon: $addon, reason: $reason, new_ver: $new_ver, updated_deps: $updated_deps, commit_msg: $commit_msg}]')
          done

          RESULT=$(echo "$MATRIX" | jq -c '{include: .}')
          echo "matrix=$RESULT" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "=== Matrix ==="
          echo "$RESULT" | jq .

      - name: Delete old workflow runs (>30 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting workflow runs created before: $CUTOFF"
          DELETED=0

          RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?created=<$CUTOFF&per_page=100" \
            --jq '.workflow_runs[] | .id') || { echo "No old runs found or API error"; exit 0; }

          for RUN_ID in $RUNS; do
            echo "Deleting run $RUN_ID..."
            gh api --method DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" && \
              DELETED=$((DELETED + 1)) || \
              echo "  Failed to delete run $RUN_ID (may be in progress)"
          done

          echo "Deleted $DELETED old workflow runs."

  trigger-release:
    needs: check-versions
    if: needs.check-versions.outputs.has_changes == 'true'
    uses: ./.github/workflows/Release.yml
    with:
      matrix: ${{ needs.check-versions.outputs.matrix }}
      force_rebuild: ${{ inputs.force_rebuild || false }}
    secrets: inherit


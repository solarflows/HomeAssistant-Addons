name: Release Addon Images

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON matrix of addons to build'
        required: true
        type: string
      force_rebuild:
        description: 'Force rebuild all addons'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(inputs.matrix || '{"include":[]}') }}
      fail-fast: false
      max-parallel: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 100

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install regctl
        run: |
          curl -sSL https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 -o /usr/local/bin/regctl
          chmod +x /usr/local/bin/regctl

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment
        id: prep
        run: |
          ADDON="${{ matrix.addon }}"
          REASON="${{ matrix.reason || 'version_changed' }}"
          NEW_VER="${{ matrix.new_ver || '' }}"

          # reason 可能是复合值（如新 addon 首次构建的 "version_changed,dockerfile,rootfs"）。
          # 必须按逗号拆分后逐项匹配：不能用 "dockerfile*|rootfs*|..." 前缀匹配，否则以
          # version_changed 开头的复合值会漏判，config.yaml 版本与 CHANGELOG 都不会回写。
          IS_VERSION_CHANGE=false
          IS_FILE_TRIGGER=false
          IFS=',' read -ra REASON_PARTS <<< "$REASON"
          for _part in "${REASON_PARTS[@]}"; do
            case "$_part" in
              version_changed) IS_VERSION_CHANGE=true ;;
              dockerfile|rootfs|config|workflow|file_changed) IS_FILE_TRIGGER=true ;;
            esac
          done

          VERSION_FILE="${ADDON}/version.yaml"
          CONFIG_FILE="${ADDON}/config.yaml"

          # ---- 计算 version / build_version / build_num ----
          # VERSION 始终是「上游版本」：用于上游 tag 查询（TAG）与 build_args 的 ${version}
          VERSION=$(yq eval '.version // ""' "$VERSION_FILE")
          OLD_VERSION="$VERSION"  # 保存旧版本号用于 commit 消息
          BUILD_NUM_CUR=$(yq eval '.tracking.build_num // 0' "$VERSION_FILE")

          if [ "$IS_VERSION_CHANGE" = "true" ]; then
            VERSION="$NEW_VER"
            BUILD_NUM=0
          else
            BUILD_NUM=$((BUILD_NUM_CUR + 1))
          fi

          # ---- 组装 HA 版本号：<上游版本>[-<version_suffix>][-build.<N>] ----
          # HA 官方约定：version 必须与镜像 tag 完全一致（下方 build 步骤用同一值打 tag）。
          BUILD_VERSION="$VERSION"

          VERSION_SUFFIX_TMPL=$(yq eval '.version_suffix // ""' "$VERSION_FILE")
          if [ -n "$VERSION_SUFFIX_TMPL" ] && [ "$VERSION_SUFFIX_TMPL" != "null" ]; then
            # 解析 ${KEY}：KEY 取自 build_args（另加 version 本身），与 Prepare build args 同口径
            SUFFIX="$VERSION_SUFFIX_TMPL"
            SUFFIX_PAIRS=$(yq eval '.build_args // {}' -o=json "$VERSION_FILE" | jq -r \
              --arg v "$VERSION" 'to_entries[] | "\(.key)=\(.value | gsub("\\$\\{version\\}"; $v))"')
            SUFFIX_PAIRS=$(printf 'version=%s\n%s' "$VERSION" "$SUFFIX_PAIRS")
            while IFS='=' read -r _sk _sv; do
              [ -z "$_sk" ] && continue
              SUFFIX="${SUFFIX//\$\{$_sk\}/$_sv}"
            done <<< "$SUFFIX_PAIRS"
            BUILD_VERSION="${BUILD_VERSION}-${SUFFIX}"
            echo "version_suffix '${VERSION_SUFFIX_TMPL}' -> '${SUFFIX}'"
          fi

          if [ "$BUILD_NUM" -gt 0 ]; then
            BUILD_VERSION="${BUILD_VERSION}-build.${BUILD_NUM}"
          fi

          # ---- HA 兼容清洗（经验规则）----
          # 以数字开头，仅允许 [0-9A-Za-z.-]；首个非法字符处截断（如 1.2.3+build -> 1.2.3）
          ADDON_VERSION=$(printf '%s' "$BUILD_VERSION" | sed 's/^[vV]//; s/^[^0-9]*//; s/[^0-9A-Za-z.-].*$//; s/[.-]*$//')
          if [ -z "$ADDON_VERSION" ]; then
            echo "::error::无法从 '${BUILD_VERSION}' 推导出 HA 兼容的版本号"
            exit 1
          fi
          if [ "$ADDON_VERSION" != "$BUILD_VERSION" ]; then
            echo "Version sanitized for HA: '${BUILD_VERSION}' -> '${ADDON_VERSION}'"
          fi
          BUILD_VERSION="$ADDON_VERSION"

          # ---- 获取 debian-base 最新 tag（全局共享，Release 自己 curl） ----
          BASE_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/hassio-addons/addon-debian-base/releases/latest" \
            | jq -r '.tag_name // "9.3.0"' | sed 's/^v//')

          # ---- 其余参数从 filesystem 推导 ----
          IMAGE=$(yq eval '.image // ""' "$CONFIG_FILE")
          [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ] && IMAGE="ghcr.io/${{ github.repository_owner }}/${ADDON}"

          DOCKERFILE="${ADDON}/Dockerfile"

          ARCHS=$(yq eval '.arch | join(",")' "$CONFIG_FILE")
          [ -z "$ARCHS" ] || [ "$ARCHS" = "null" ] && ARCHS="aarch64,amd64"
          PLATFORMS=$(echo "$ARCHS" | sed 's/aarch64/arm64/g; s/amd64/amd64/g; s/armhf/arm\/v7/g; s/armv7/arm\/v7/g; s/i386/386/g' | sed 's/\([^,]*\)/linux\/\1/g')

          TAG="v${VERSION}"

          REPO=$(yq eval '.repo' "$VERSION_FILE")

          CHANGELOG_SOURCE=$(yq eval '.changelog.source // "release_body"' "$VERSION_FILE")
          CHANGELOG_MODE=$(yq eval '.changelog.mode // "prepend"' "$VERSION_FILE")
          CHANGELOG_FILE_URL=$(yq eval '.changelog.file_url // ""' "$VERSION_FILE")
          CHANGELOG_FILE_PATH=$(yq eval '.changelog.file_path // ""' "$VERSION_FILE")

          # 优先使用 Version_Check 通过 matrix 传来的 commit message
          COMMIT_MSG="${{ matrix.commit_msg || '' }}"
          if [ -z "$COMMIT_MSG" ] && [ "$IS_FILE_TRIGGER" = "true" ]; then
            # fallback: 从 git log 重新计算（可能因 shallow clone 失败）
            # 同样限定在 file_sha..HEAD 并排除 CI 自动提交；不回退到全量历史
            FILE_SHA=$(yq eval '.tracking.file_sha // ""' "$VERSION_FILE")
            if [ -n "$FILE_SHA" ] && [ "$FILE_SHA" != "null" ]; then
              COMMIT_MSG=$(git log --pretty=format:"- %s" "${FILE_SHA}..HEAD" -- "${ADDON_DIR}/" 2>/dev/null \
                | grep -vE '^- (build\(|chore\([^)]*\): upstream )' || echo "")
            fi
          fi

          echo "addon=$ADDON" >> $GITHUB_OUTPUT
          echo "addon_dir=$ADDON" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "changelog_source=$CHANGELOG_SOURCE" >> $GITHUB_OUTPUT
          echo "changelog_mode=$CHANGELOG_MODE" >> $GITHUB_OUTPUT
          echo "changelog_file_url=$CHANGELOG_FILE_URL" >> $GITHUB_OUTPUT
          echo "changelog_file_path=$CHANGELOG_FILE_PATH" >> $GITHUB_OUTPUT
          echo "base_tag=$BASE_TAG" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          # commit_msg 可能是多行，用 heredoc 语法
          {
            echo "commit_msg<<COMMIT_EOF"
            echo "$COMMIT_MSG"
            echo "COMMIT_EOF"
          } >> $GITHUB_OUTPUT
          echo "is_file_trigger=$IS_FILE_TRIGGER" >> $GITHUB_OUTPUT
          # 跨步骤传递：每个 step 是独立 shell，判断标志必须导出为 step output
          echo "is_version_change=$IS_VERSION_CHANGE" >> $GITHUB_OUTPUT

      - name: Prepare build args
        id: buildargs
        run: |
          ADDON_DIR="${{ steps.prep.outputs.addon_dir }}"
          VERSION="${{ steps.prep.outputs.version }}"
          TAG="${{ steps.prep.outputs.tag }}"
          VERSION_FILE="${ADDON_DIR}/version.yaml"

          # 从 version.yaml 的 build_args 字段动态生成构建参数
          BUILD_ARGS=""
          if [ -f "$VERSION_FILE" ]; then
            BUILD_ARGS=$(yq eval '.build_args // {}' -o=json "$VERSION_FILE" | jq -r \
              --arg v "$VERSION" --arg t "$TAG" \
              'to_entries[] | "\(.key)=\(.value | gsub("\\$\\{version\\}"; $v) | gsub("\\$\\{tag\\}"; $t))"')
          fi

          {
            echo "build_args<<BUILDARGS_EOF"
            echo "$BUILD_ARGS"
            echo "BUILDARGS_EOF"
          } >> $GITHUB_OUTPUT
          echo "Build args: $BUILD_ARGS"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.prep.outputs.addon_dir }}
          file: ${{ steps.prep.outputs.dockerfile }}
          platforms: ${{ steps.prep.outputs.platforms }}
          push: true
          build-args: ${{ steps.buildargs.outputs.build_args }}
          tags: |
            ${{ steps.prep.outputs.image }}:latest
            ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.build_version }}
          cache-from: type=gha,scope=${{ matrix.addon }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon }},ignore-error=true

      - name: Prepare config updates & commit
        if: success()
        id: config
        run: |
          ADDON_DIR="${{ steps.prep.outputs.addon_dir }}"
          ADDON="${{ steps.prep.outputs.addon }}"
          VERSION="${{ steps.prep.outputs.version }}"
          BUILD_VERSION="${{ steps.prep.outputs.build_version }}"
          TAG="${{ steps.prep.outputs.tag }}"
          REPO="${{ steps.prep.outputs.repo }}"
          REASON="${{ steps.prep.outputs.reason }}"
          CHANGELOG_SOURCE="${{ steps.prep.outputs.changelog_source }}"
          CHANGELOG_MODE="${{ steps.prep.outputs.changelog_mode }}"
          CHANGELOG_FILE_URL="${{ steps.prep.outputs.changelog_file_url }}"
          CHANGELOG_FILE_PATH="${{ steps.prep.outputs.changelog_file_path }}"
          COMMIT_MSG="${{ steps.prep.outputs.commit_msg }}"
          BASE_TAG="${{ steps.prep.outputs.base_tag }}"
          BUILD_NUM="${{ steps.prep.outputs.build_num }}"
          IS_FILE_TRIGGER="${{ steps.prep.outputs.is_file_trigger || 'false' }}"
          IS_VERSION_CHANGE="${{ steps.prep.outputs.is_version_change || 'false' }}"
          OLD_VERSION="${{ steps.prep.outputs.old_version || '' }}"
          TIMESTAMP=$(date -u +"%Y-%m-%d")

          # 更新 config.yaml 版本号（使用 build_version，含 -build.N 后缀保证 HAOS 识别更新）
          if [ "$IS_VERSION_CHANGE" = "true" ] || [ "$IS_FILE_TRIGGER" = "true" ] || [ "$REASON" = "base_updated" ] || [ "$REASON" = "force_rebuild" ]; then
            yq eval ".version = \"${BUILD_VERSION}\"" -i "${ADDON_DIR}/config.yaml"
            echo "Updated ${ADDON_DIR}/config.yaml to version ${BUILD_VERSION}"
          fi

          # 更新 CHANGELOG.md
          # 注：复合 reason（version_changed + 文件变更）优先按「上游版本变更」记录，
          #     以便取到上游 release notes；纯文件变更才走文件分支。
          if [ "$IS_FILE_TRIGGER" = "true" ] && [ "$IS_VERSION_CHANGE" != "true" ]; then
            # 文件变更：支持复合 reason（如 dockerfile,rootfs）
            CHANGELOG_TAG=""
            IFS=',' read -ra REASONS <<< "$REASON"
            for r in "${REASONS[@]}"; do
              case "$r" in
                dockerfile)  TAG_PART="Dockerfile" ;;
                rootfs)      TAG_PART="rootfs" ;;
                config)      TAG_PART="config" ;;
                workflow)    TAG_PART="CI" ;;
                *)           TAG_PART="$r" ;;
              esac
              [ -n "$CHANGELOG_TAG" ] && CHANGELOG_TAG="${CHANGELOG_TAG} + "
              CHANGELOG_TAG="${CHANGELOG_TAG}${TAG_PART}"
            done
            CHANGELOG_TAG="${CHANGELOG_TAG} 变更"
            CHANGELOG_CONTENT="${CHANGELOG_TAG}\n${COMMIT_MSG:-（本次构建无代码变更）}"
            if [ -f "${ADDON_DIR}/CHANGELOG.md" ]; then
              printf "### %s (%s)\n%b\n\n" "$BUILD_VERSION" "$TIMESTAMP" "$CHANGELOG_CONTENT" > temp_changelog.md
              cat temp_changelog.md "${ADDON_DIR}/CHANGELOG.md" > combined.md 2>/dev/null || mv temp_changelog.md "${ADDON_DIR}/CHANGELOG.md"
              mv combined.md "${ADDON_DIR}/CHANGELOG.md" 2>/dev/null
              rm -f temp_changelog.md combined.md
            else
              printf "### %s (%s)\n%b\n\n" "$BUILD_VERSION" "$TIMESTAMP" "$CHANGELOG_CONTENT" > "${ADDON_DIR}/CHANGELOG.md"
            fi
            echo "Updated ${ADDON_DIR}/CHANGELOG.md with file change record"
          elif [ "$REASON" = "base_updated" ]; then
            # 底包更新
            CHANGELOG_CONTENT="底包更新至 ${BASE_TAG}，无功能变更"
            if [ -f "${ADDON_DIR}/CHANGELOG.md" ]; then
              printf "### %s (%s)\n%s\n\n" "$BUILD_VERSION" "$TIMESTAMP" "$CHANGELOG_CONTENT" > temp_changelog.md
              cat temp_changelog.md "${ADDON_DIR}/CHANGELOG.md" > combined.md 2>/dev/null || mv temp_changelog.md "${ADDON_DIR}/CHANGELOG.md"
              mv combined.md "${ADDON_DIR}/CHANGELOG.md" 2>/dev/null
              rm -f temp_changelog.md combined.md
            else
              printf "### %s (%s)\n%s\n\n" "$BUILD_VERSION" "$TIMESTAMP" "$CHANGELOG_CONTENT" > "${ADDON_DIR}/CHANGELOG.md"
            fi
            echo "Updated ${ADDON_DIR}/CHANGELOG.md with base image update record"
          elif [ "$REASON" = "force_rebuild" ]; then
            CHANGELOG_CONTENT="手动触发强制重建"
            if [ -f "${ADDON_DIR}/CHANGELOG.md" ]; then
              printf "### %s (%s)\n%s\n\n" "$BUILD_VERSION" "$TIMESTAMP" "$CHANGELOG_CONTENT" > temp_changelog.md
              cat temp_changelog.md "${ADDON_DIR}/CHANGELOG.md" > combined.md 2>/dev/null || mv temp_changelog.md "${ADDON_DIR}/CHANGELOG.md"
              mv combined.md "${ADDON_DIR}/CHANGELOG.md" 2>/dev/null
              rm -f temp_changelog.md combined.md
            else
              printf "### %s (%s)\n%s\n\n" "$BUILD_VERSION" "$TIMESTAMP" "$CHANGELOG_CONTENT" > "${ADDON_DIR}/CHANGELOG.md"
            fi
          elif [ "$IS_VERSION_CHANGE" = "true" ]; then
            if [ "$CHANGELOG_SOURCE" = "tag_file" ] && [ -n "$CHANGELOG_FILE_PATH" ]; then
              # 从指定 tag 下的文件获取 changelog（使用 GitHub Contents API）
              CHANGELOG_CONTENT=$(curl -fsSL \
                -H "Accept: application/vnd.github.raw+json" \
                "https://api.github.com/repos/${REPO}/contents/${CHANGELOG_FILE_PATH}?ref=${TAG}" 2>/dev/null || \
                curl -fsSL \
                -H "Accept: application/vnd.github.raw+json" \
                "https://api.github.com/repos/${REPO}/contents/${CHANGELOG_FILE_PATH}?ref=${VERSION}" || echo "")
              if [ -n "$CHANGELOG_CONTENT" ]; then
                if [ "$CHANGELOG_MODE" = "replace" ]; then
                  echo "$CHANGELOG_CONTENT" > "${ADDON_DIR}/CHANGELOG.md"
                else
                  printf "### %s (%s)\n%s\n\n" "$BUILD_VERSION" "$TIMESTAMP" "$CHANGELOG_CONTENT" > temp_changelog.md
                  cat temp_changelog.md "${ADDON_DIR}/CHANGELOG.md" > combined.md 2>/dev/null || mv temp_changelog.md "${ADDON_DIR}/CHANGELOG.md"
                  mv combined.md "${ADDON_DIR}/CHANGELOG.md" 2>/dev/null
                  rm -f temp_changelog.md combined.md
                fi
              fi
            elif [ "$CHANGELOG_SOURCE" = "file" ] && [ -n "$CHANGELOG_FILE_URL" ]; then
              FILE_CONTENT=$(curl -fsSL "$CHANGELOG_FILE_URL" || echo "")
              if [ -n "$FILE_CONTENT" ]; then
                if [ "$CHANGELOG_MODE" = "replace" ]; then
                  echo "$FILE_CONTENT" > "${ADDON_DIR}/CHANGELOG.md"
                else
                  printf "### %s (%s)\n%s\n\n" "$BUILD_VERSION" "$TIMESTAMP" "$FILE_CONTENT" > temp_changelog.md
                  cat temp_changelog.md "${ADDON_DIR}/CHANGELOG.md" > combined.md 2>/dev/null || mv temp_changelog.md "${ADDON_DIR}/CHANGELOG.md"
                  mv combined.md "${ADDON_DIR}/CHANGELOG.md" 2>/dev/null
                  rm -f temp_changelog.md combined.md
                fi
              fi
            else
              # 默认: release_body - 从 GitHub release body 获取
              RELEASE_BODY=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
                | jq -r '.body // empty')
              # fallback: some repos don't use v prefix (e.g. uptime-kuma)
              [ -z "$RELEASE_BODY" ] && RELEASE_BODY=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/tags/${VERSION}" \
                | jq -r '.body // empty')
              [ -z "$RELEASE_BODY" ] && RELEASE_BODY="No changelog available."

              if [ "$CHANGELOG_MODE" = "replace" ]; then
                printf "### %s (%s)\n%s\n\n" "$BUILD_VERSION" "$TIMESTAMP" "$RELEASE_BODY" > "${ADDON_DIR}/CHANGELOG.md"
              else
                # prepend: 新条目添加到开头
                printf "### %s (%s)\n%s\n\n" "$BUILD_VERSION" "$TIMESTAMP" "$RELEASE_BODY" > temp_changelog.md
                cat temp_changelog.md "${ADDON_DIR}/CHANGELOG.md" > combined.md 2>/dev/null || mv temp_changelog.md "${ADDON_DIR}/CHANGELOG.md"
                mv combined.md "${ADDON_DIR}/CHANGELOG.md" 2>/dev/null
                rm -f temp_changelog.md combined.md
              fi
            fi
          fi

          # 更新 version.yaml 中的 tracking 字段
          VERSION_FILE="${ADDON_DIR}/version.yaml"
          CURRENT_SHA=$(git rev-parse HEAD)
          yq eval ".tracking.file_sha = \"${CURRENT_SHA}\"" -i "$VERSION_FILE"
          yq eval ".tracking.build_num = ${BUILD_NUM}" -i "$VERSION_FILE"
          # version_changed 时更新版本号（清洁版本号，用于下次比较基准）
          if [ "$IS_VERSION_CHANGE" = "true" ]; then
            yq eval ".version = \"${VERSION}\"" -i "$VERSION_FILE"
          fi
          # 仅 debian-base 系 addon 更新 base_tag
          ADDON_BASE_TAG=$(yq eval '.tracking.base_tag // "null"' "$VERSION_FILE")
          if [ "$ADDON_BASE_TAG" != "null" ] && [ "$ADDON_BASE_TAG" != "" ]; then
            yq eval ".tracking.base_tag = \"${BASE_TAG}\"" -i "$VERSION_FILE"
          fi
          echo "Updated tracking in $VERSION_FILE"

          # 独立提交：每个 addon 构建成功后立即 commit+push 自己的更新
          if git diff --quiet; then
            echo "No changes for ${ADDON}, skip commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${ADDON_DIR}/"
            if [ "$IS_FILE_TRIGGER" = "true" ] && [ "$IS_VERSION_CHANGE" != "true" ]; then
              # 文件变更：支持复合 reason，生成可读标签
              COMMIT_LABEL=""
              IFS=',' read -ra REASONS <<< "$REASON"
              for r in "${REASONS[@]}"; do
                case "$r" in
                  dockerfile)  PART="Dockerfile" ;;
                  rootfs)      PART="rootfs" ;;
                  config)      PART="config" ;;
                  workflow)    PART="CI" ;;
                  *)           PART="$r" ;;
                esac
                [ -n "$COMMIT_LABEL" ] && COMMIT_LABEL="${COMMIT_LABEL} + "
                COMMIT_LABEL="${COMMIT_LABEL}${PART}"
              done
              git commit -m "build(${ADDON}): ${COMMIT_LABEL} 变更 → ${BUILD_VERSION}" \
                         -m "${COMMIT_MSG:-${COMMIT_LABEL} updated}"
            elif [ "$REASON" = "base_updated" ]; then
              ADDON_OLD_BASE=$(yq eval '.tracking.base_tag // "?"' "$VERSION_FILE")
              git commit -m "build(${ADDON}): debian-base ${ADDON_OLD_BASE} → ${BASE_TAG}，${BUILD_VERSION}" \
                         -m "底包 ${ADDON_OLD_BASE} → ${BASE_TAG}，重建以适配新系统层"
            elif [ "$REASON" = "force_rebuild" ]; then
              git commit -m "build(${ADDON}): 手动强制重建 → ${BUILD_VERSION}" \
                         -m "force_rebuild by ${{ github.actor }} on ${TIMESTAMP}"
            else
              # version_changed：标注版本跃迁
              if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" != "$VERSION" ]; then
                VER_DESC="${OLD_VERSION} → ${VERSION}"
              else
                VER_DESC="${VERSION}"
              fi
              RELEASE_TITLE=$(echo "$RELEASE_BODY" | head -3 | tr '\n' ' ' | cut -c1-200)
              git commit -m "chore(${ADDON}): upstream ${VER_DESC}" \
                         -m "${RELEASE_TITLE:-Upstream release ${VERSION}}"
            fi
            # 重试 push，处理并行构建的竞态
            # 每次重试前 pull --rebase 合并远程变更
            PUSH_OK=false
            for i in 1 2 3; do
              echo "Push attempt $i/3..."
              if git pull --rebase origin main; then
                if git push origin main; then
                  PUSH_OK=true
                  break
                fi
              fi
              # rebase 冲突时：version.yaml 冲突自动解决（保留我们的 tracking 更新）
              # rebase 中 ours=远程 theirs=我们（本地 commit）
              if [ -f "${ADDON_DIR}/version.yaml" ]; then
                git checkout --theirs "${ADDON_DIR}/version.yaml" 2>/dev/null || true
                git add "${ADDON_DIR}/version.yaml" 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || true
              fi
              # 如果 rebase --continue 仍然失败，abort 后重试
              git rebase --abort 2>/dev/null || true
              echo "Attempt $i failed, waiting before retry..."
              sleep $((i * 3))
            done
            if [ "$PUSH_OK" = "false" ]; then
              echo "ERROR: Push failed after 3 attempts for ${ADDON}"
              exit 1
            fi
            echo "Committed ${ADDON} ${VERSION}"
          fi

      - name: Build summary
        if: always()
        run: |
          IMAGE="${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.build_version }}"
          STATUS="${{ job.status }}"

          {
            if [ "$STATUS" = "success" ]; then
              echo "### ✅ ${{ matrix.addon }} — \`${IMAGE}\`"
            else
              echo "### ❌ ${{ matrix.addon }} — build failed"
              exit 0
            fi
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          # 获取多架构列表（过滤 attestation 层）
          for i in 1 2 3 4 5; do
            RAW=$(docker buildx imagetools inspect "$IMAGE" --raw 2>/dev/null)
            [ -n "$RAW" ] && break
            sleep 3
          done

          if [ -n "$RAW" ]; then
            echo "| 架构 | 大小 |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            echo "$RAW" | jq -r '.manifests[]? | select(.platform.architecture != "unknown") | "\(.platform.os)/\(.platform.architecture)"' \
              | while read -r platform; do
                  SIZE=$(regctl manifest get "$IMAGE" --platform "$platform" --format '{{ .GetSize }}' 2>/dev/null)
                  if [ -n "$SIZE" ]; then
                    SIZE_MB=$(awk "BEGIN {printf \"%.1f MB\", $SIZE / 1000000}")
                  else
                    SIZE_MB="N/A"
                  fi
                  echo "| \`${platform}\` | ${SIZE_MB} |" >> $GITHUB_STEP_SUMMARY
                done
          else
            echo "*(image info unavailable)*" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

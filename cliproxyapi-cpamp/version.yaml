# cliproxyapi-cpamp 版本检查配置
# 主版本跟踪: router-for-me/CLIProxyAPI releases (tag_prefix "v")
# version_suffix: HA 版本号 = <上游版本>-<PANEL_VERSION>（混合两上游版本，如 8.0.23-1.14.5）
# PANEL_VERSION: CPAMP (seakee/CPA-Manager-Plus) 版本，供
#   - 完整版 Manager Server 二进制
#   - CPA 轻量面板种子 management.html
#   两处使用；手动更新，不参与自动跟踪
version: "8.0.23"
source: github
repo: router-for-me/CLIProxyAPI
build_args:
  CPA_VERSION: "${version}"
  PANEL_VERSION: "1.14.5"
version_suffix: "${PANEL_VERSION}"
changelog:
  source: release_body
  mode: prepend
tracking:
  base_tag: "9.5.0"
  file_sha: "aa78f96257806c2e48230ab091680d8cd069311e"
  build_num: 0

# cliproxyapi-cpamp 版本检查配置
# 主版本跟踪: router-for-me/CLIProxyAPI releases (tag_prefix "v")
# version_suffix: HA 版本号 = <上游版本>-<PANEL_VERSION>（混合两上游版本，如 8.0.23-1.14.5）
# dependencies: 支持监控任意 N 个副仓库组件，自动更新 build_args
version: "8.0.54"
source: github
repo: router-for-me/CLIProxyAPI
build_args:
  CPA_VERSION: "${version}"
  PANEL_VERSION: "1.14.10"
version_suffix: "${PANEL_VERSION}"
dependencies:
  PANEL_VERSION:
    repo: seakee/CPA-Manager-Plus
    source: github
changelog:
  source: release_body
  mode: prepend
tracking:
  base_tag: ""
  file_sha: "5bd918687dffa825cfa954545275843f75b1c064"
  build_num: 0

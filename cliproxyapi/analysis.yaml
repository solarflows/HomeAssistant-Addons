# analysis.yaml — cliproxyapi addon upstream analysis
# https://github.com/solarflows/HomeAssistant-Addons/.github/skills/plan-addon
# 证据: 上游 Dockerfile / compose / config.example.yaml / release 资产 /
#       内部源码 (managementasset/updater.go, main.go, server_routes.go) / 二进制字符串实测
---
upstream:
  repo: router-for-me/CLIProxyAPI
  description: >-
    多账号 AI CLI 网关：将 Gemini CLI / OpenAI Codex / Claude Code / Antigravity /
    Grok / Kimi 等 OAuth 账号转换为 OpenAI/Gemini/Claude 兼容 API（MIT）。
  license: MIT
  panel:
    repo: seakee/CPA-Manager-Plus
    license: MIT
    edition: lightweight   # 单文件 management.html 替换官方面板，无额外服务/数据库
    pinned_build_arg: PANEL_VERSION   # 不参与 CI 自动跟踪，需手动 bump

build:
  strategy: binary-download
  stages: []
  version_arg: CPA_VERSION
  builder_image: ""
  apt_build_deps: []
  runtime_apt_deps:
    - curl
    - ca-certificates
  build_steps:
    - 架构映射: amd64→amd64, arm64→aarch64 (release tarball 用 aarch64 命名)
    - CPA_URL="https://github.com/router-for-me/CLIProxyAPI/releases/download/v${CPA_VERSION}/CLIProxyAPI_${CPA_VERSION}_linux_${ARCH}.tar.gz"
    - curl -fsSL --retry 3 下载并 tar -xzf 到 /CLIProxyAPI （tarball 内为单文件 cli-proxy-api，~70MB）
    - 使用默认 Linux 构建（支持动态插件的 CGO 版本，GLIBC 2.17 基线）；不使用 _no-plugin（musl/OpenWrt 用）
    - PANEL_URL="https://github.com/seakee/CPA-Manager-Plus/releases/download/v${PANEL_VERSION}/management.html" → /opt/cliproxyapi-seed/
  artifacts:
    - /CLIProxyAPI/cli-proxy-api
    - /opt/cliproxyapi-seed/management.html

runtime:
  language: binary
  entrypoint: S6 longrun → cli-proxy-api -config /CLIProxyAPI/config.yaml (CWD=/CLIProxyAPI)
  working_dir: /CLIProxyAPI
  env:
    # Dockerfile ENV
    WRITABLE_PATH: /data/cliproxyapi           # 运行时可写目录统一基准（logs/static/discovery）
    MANAGEMENT_STATIC_PATH: /data/cliproxyapi/static   # 面板缓存目录（override StaticDir）
    # 其他: 无（配置全部走 config.yaml）
  data_dir: /config/cliproxyapi   # 见 filesystem

network:
  port: 8317
  protocol: tcp
  aux_ports:
    # 来源: 上游 docker-compose.yml 默认发布的端口列表；二进制字符串证据:
    #   http://localhost:1455/auth/callback   (Codex)
    #   http://localhost:54545/callback       (Antigravity)
    #   http://localhost:%d/oauth-callback    (Claude 等通用)
    # 8085/51121/11451 未在二进制中找到字符串证据，按上游 compose 保留为备用（默认关闭）
    - port: 1455
      purpose: Codex OAuth callback
      default: disabled
    - port: 54545
      purpose: Antigravity OAuth callback
      default: disabled
    - port: 8085
      purpose: OAuth callback (备用)
      default: disabled
    - port: 51121
      purpose: OAuth callback (备用)
      default: disabled
    - port: 11451
      purpose: OAuth callback (备用)
      default: disabled
  health: "http://127.0.0.1:8317/healthz"   # 上游原生（server_routes.go: GET /healthz）
  ingress: false   # 本轮明确不启用；面板路径 /management.html，SPA + 大量 API/WebSocket，需专项实测后再议

filesystem:
  persistent_dirs:
    - container: /config/cliproxyapi/config.yaml
      ha: /config/cliproxyapi/config.yaml
      type: file
      reason: 主配置；首启由 00-init.sh 生成（seed-once），之后由面板/用户接管
    - container: /config/cliproxyapi/auths
      ha: /config/cliproxyapi/auths
      type: dir
      reason: OAuth 凭据（config 中 oauth.auth-dir 显式指向）；随 HA 备份
    - container: /root/.cli-proxy-api
      ha: /config/cliproxyapi/auths
      type: symlink
      reason: 上游默认 auth-dir（~/.cli-proxy-api）双保险
    - container: /CLIProxyAPI/config.yaml
      ha: /config/cliproxyapi/config.yaml
      type: symlink
      reason: 进程 -config 参数指向；CWD 默认配置路径兼容
    - container: /CLIProxyAPI/logs
      ha: /data/cliproxyapi/logs
      type: symlink
      reason: 文件日志（logging-to-file 默认关闭，输出 stdout）
    - container: /CLIProxyAPI/plugins
      ha: /data/cliproxyapi/plugins
      type: symlink
      reason: 插件目录（plugins.enabled 默认 false；ResolvePluginsDir 相对 "plugins" → CWD）
    - container: /data/cliproxyapi/static
      ha: /data/cliproxyapi/static
      type: dir
      reason: 管理面板缓存（MANAGEMENT_STATIC_PATH），跨 addon 更新保留
    - container: /data/cliproxyapi/discovery
      ha: /data/cliproxyapi/discovery
      type: dir
      reason: >-
        discovery 状态目录（WRITABLE_PATH/discovery）；
        未设 WRITABLE_PATH 时上游会落到 /root/.config/cpa/discovery（容器层，不持久）——
        已通过 ENV WRITABLE_PATH=/data/cliproxyapi 修正
  write_path_audit:
    # 源码级全量审计（2026-10-10），非测试代码写入点穷举:
    - config.yaml → -config 绝对路径 /config ✓
    - auths/ + .cds 冷却文件（next to auth files）→ /config ✓
    - logs → ResolveLogDirectory = WRITABLE_PATH/logs（修复前依赖 CWD/logs 软链）✓
    - static 面板缓存 → MANAGEMENT_STATIC_PATH 优先（否则 WRITABLE_PATH/static）✓
    - plugins → CWD/plugins 软链 ✓
    - discovery 状态 → WRITABLE_PATH/discovery ✓（修复项）
    - usage 统计纯内存（redis-usage-queue-retention-seconds，无落盘）✓
    - postgres/object/git store 本地路径 → 未使用（WRITABLE_PATH 兜底）n/a
  hardcoded_paths: []
  cwd_matters: true   # 无 -config 时默认 <CWD>/config.yaml；run 脚本显式 -config
  generated_files:
    - /config/cliproxyapi/management_key.txt   # 首启生成的管理密钥明文副本（面板登录用）

config:
  options:
    MANAGEMENT_KEY:
      type: password?
      default: ""
      description: 管理 API/面板密钥；留空自动生成。seed-once（仅首建配置时写入）
    PROXY_URL:
      type: str?
      default: ""
      description: 上游请求 + 面板下载代理（requests.proxy-url）；seed-once
  schema:
    MANAGEMENT_KEY: password?
    PROXY_URL: str?
  seed_config: |
    config-version: 8
    management:
      allow-remote: true            # 局域网浏览器访问管理 API 必需
      disable-control-panel: false
      panel-github-repository: "https://github.com/seakee/CPA-Manager-Plus"
      secret-key: "<option|generated>"
    access:
      api-keys: ["your-api-key-1"]  # 占位符触发 CPA 安全模式（代理禁用）直到用户替换
    oauth:
      auth-dir: "/config/cliproxyapi/auths"

adaptations:
  - 上游为 Go 多阶段镜像（golang builder + debian:bookworm runtime）；本仓库改为 release 二进制 + debian-base(S6)，避免 CI 交叉编译耗时
  - release tarball 单文件 cli-proxy-api（默认构建支持动态插件，GLIBC 2.17 基线 → debian-base 兼容）
  - 管理面板替换机制采用上游原生能力：management.panel-github-repository + EnsureLatestManagementHTML
    （每 3h 检查 GitHub Release 的 management.html 资产 → 原子替换缓存文件）
  - 镜像内置固定版本面板种子（PANEL_VERSION），00-init.sh 在缓存缺失时恢复 → 断网首启可用
  - allow-remote: true 为默认：Docker 端口发布使局域网客户端非 loopback，否则面板/API 不可用（安全依赖强密钥）
  - 用户配置 seed-once：CPA 会将 secret-key 明文转换为 bcrypt 哈希写回 config，禁止每次启动重写
  - MANAGEMENT_STATIC_PATH 指向 /data（持久化），避免每次 addon 更新重新下载面板
  - 占位 API Key 保留上游安全模式行为（示例密钥检测 → 代理接口禁用），降低误暴露风险

open_questions:
  - OAuth 回调端口的容器内监听地址（0.0.0.0 vs 127.0.0.1）与局域网回调辅助的实际可用性需运行测试
  - 8085/51121/11451 的具体提供方未从二进制确认（保留上游 compose 默认）
  - ingress 明确本轮不启用；后续若启用需实测 SPA 子路径 + WebSocket
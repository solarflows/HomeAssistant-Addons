# cliproxyapi 版本检查配置
# 主版本跟踪: router-for-me/CLIProxyAPI releases (tag_prefix "v")
# dependencies: 支持监控任意 N 个副仓库组件，自动更新 build_args
version: "8.0.52"
source: github
repo: router-for-me/CLIProxyAPI
build_args:
  CPA_VERSION: "${version}"
  PANEL_VERSION: "1.14.10"
dependencies:
  PANEL_VERSION:
    repo: seakee/CPA-Manager-Plus
    source: github
changelog:
  source: release_body
  mode: prepend
tracking:
  base_tag: "9.5.1"
  file_sha: "d89491494f4d9d236aef34b66568d37d1fcbe5b1"
  build_num: 1

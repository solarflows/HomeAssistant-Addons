# cliproxyapi 版本检查配置
# 主版本跟踪: router-for-me/CLIProxyAPI releases (tag_prefix "v")
# dependencies: 支持监控任意 N 个副仓库组件，自动更新 build_args
version: "8.1.1"
source: github
repo: router-for-me/CLIProxyAPI
build_args:
  CPA_VERSION: "${version}"
  PANEL_VERSION: "1.14.10"
dependencies:
  PANEL_VERSION:
    repo: seakee/CPA-Manager-Plus
    source: github
changelog:
  source: release_body
  mode: prepend
tracking:
  base_tag: ""
  file_sha: "6d3e2d06b5105f06fb3952c56f939c2ef132e6db"
  build_num: 0

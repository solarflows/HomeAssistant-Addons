global
    maxconn 256
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout tunnel  1h

frontend ingress_fe
    bind :8071
    # 动态切除 Ingress Token 前缀: /api/hassio_ingress/<token>/(.*) -> /\1
    http-request replace-path /api/hassio_ingress/[^/]+/?(.*) /\1
    # 根路径访问自动重定向至 management.html?safe-mode=configure（直达面板并绕过拦截页）
    http-request redirect location management.html?safe-mode=configure if { path / }
    default_backend cpa_backend

backend cpa_backend
    server cpa_server 127.0.0.1:8317 check inter 2s

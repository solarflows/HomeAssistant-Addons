---
configuration:
  no_proxy:
    name: No proxy domains
    description: >-
      Domains that bypass the HTTP proxy, comma-separated.
      Default: *.aliyundrive.com
  ALIST_PORT:
    name: AList port
    description: >-
      External AList service port. Default: 5244.
  INSTALL:
    name: Install mode
    description: >-
      Installation mode, fixed to "new" for standalone edition.
  LOW_MEMORY:
    name: Low memory mode
    description: >-
      Enable to limit JVM heap to 512MB. Disable for 1024MB.
      Recommended for most HA installations.
  ATV_DEBUG:
    name: Debug mode
    description: >-
      Enable Spring Boot debug logging (condition evaluation report).
      Only enable when troubleshooting startup issues.
network:
  4567/tcp: Management Web UI (TvBox config, subscriptions)

name: Uptime Kuma
slug: uptime-kuma
version: "2.5.9-build.13"
image: ghcr.io/solarflows/uptime-kuma
description: "A fancy self-hosted monitoring tool"
url: https://github.com/louislam/uptime-kuma
init: false
arch:
  - aarch64
  - amd64
webui: "[PROTO:http]://[HOST]:[PORT:3001]"
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: 'Uptime Kuma Web UI port'
map:
  - type: app_config
    path: /opt/uptime-kuma/data
    read_only: false
  - type: homeassistant_config
    path: /legacy_ha
    read_only: false
  - type: share
    path: /share
    read_only: false
  - type: ssl
    path: /ssl
    read_only: true
startup: application
boot: manual
ingress: true
ingress_port: 3001

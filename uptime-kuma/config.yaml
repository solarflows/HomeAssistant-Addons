name: Uptime Kuma
slug: uptime-kuma
version: "2.5.9-build.6"
image: ghcr.io/solarflows/uptime-kuma
description: "A fancy self-hosted monitoring tool"
url: https://github.com/louislam/uptime-kuma
init: false
arch:
  - aarch64
  - amd64
webui: "[PROTO:http]://[HOST]:[PORT:3001]"
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: 'Uptime Kuma Web UI port'
map:
  - addon_config:rw
  - share:rw
  - ssl:ro
startup: application
boot: manual
ingress: true
ingress_port: 3001

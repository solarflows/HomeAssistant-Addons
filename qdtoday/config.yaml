name: QD-Today
slug: qdtoday
version: "20261108-build.16"
image: ghcr.io/solarflows/qdtoday
description: "QD HTTP 请求定时任务自动执行框架（内置 HAR 抓包编辑器与全量 OCR 验证码识别栈）"
url: https://github.com/qd-today/qd
init: false
arch:
  - aarch64
  - amd64
webui: "[PROTO:http]://[HOST]:[PORT:8923]"
ports:
  8923/tcp: 8923
ports_description:
  8923/tcp: "QD Web UI port"
# 可选配置项：修改后保存即可生效，无需重启整个 addon。
# 常用配置在 UI 中可见；高级配置可手动写入 YAML（见下方 schema）。
options:
  QD_DEBUG: false
  USE_PYCURL: true
schema:
  QD_DEBUG: bool?
  USE_PYCURL: bool?
  AES_KEY: str?
  COOKIE_SIGN_SECRET: str?
  COOKIE_SECRET: str?
  DOMAIN: str?
  MAIL_SMTP: str?
  MAIL_PORT: int?
  MAIL_USER: str?
  MAIL_PASSWORD: password?
  # 高级配置（UI 中隐藏，手动写入 YAML 生效）
  DNS_SERVER: str?
  TRACEBACK_PRINT: bool?
  PUSH_BATCH_SW: bool?
  PROXIES: str?
  MAIL_SSL: bool?
  TASK_REQUEST_LIMIT: int?
  TASK_WHILE_LOOP_TIMEOUT: int?
  NEW_TASK_DELAY: int?
map:
  - type: app_config
    path: /usr/src/app/config
    read_only: false
  - type: homeassistant_config
    path: /legacy_ha
    read_only: false
  - type: ssl
    path: /ssl
    read_only: true
startup: application
boot: manual

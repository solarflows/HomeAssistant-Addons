---
configuration:
  LOW_MEMORY:
    name: Low memory mode
    description: >-
      Enable to limit JVM heap to 512MB. Disable for 1024MB.
      Recommended for most HA installations.
  ATV_DEBUG:
    name: Debug mode
    description: >-
      Enable Spring Boot debug logging (condition evaluation report).
      Only enable when troubleshooting startup issues.
  AUTO_UPDATE:
    name: Background auto-update
    description: >-
      Periodically syncs Xiaoya indexes and storages in the background without blocking boot.
      Disable for 100% offline operation.
  JVM_OPTS:
    name: Custom JVM options
    description: >-
      Additional JVM parameters appended to the Java runtime.
      Leave empty for default configuration.
network:
  4567/tcp: Management Web UI (TvBox config, subscriptions)
  80/tcp: AList Web UI (file browsing, cloud storage management)

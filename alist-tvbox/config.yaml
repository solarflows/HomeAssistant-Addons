name: AList-TvBox
slug: alist-tvbox
version: "1.136.0"
image: ghcr.io/solarflows/alist-tvbox
description: "AList-TvBox 影视聚合与内置 AList 内核一体化服务（支持网盘挂载、播单管理、多源搜索与 Nginx 网关）"
url: https://github.com/power721/alist-tvbox
init: false
arch:
  - aarch64
  - amd64
icon: mdi:television-box
webui: "[PROTO:http]://[HOST]:[PORT:4567]"
ports:
  4567/tcp: 4567
  80/tcp: 5344
ports_description:
  4567/tcp: "Manager Web UI port"
  80/tcp: "Alist Web UI port"
environment:
  no_proxy: "*.aliyundrive.com"
  ALIST_PORT: "5344"
  INSTALL: "xiaoya"
# 可选配置项：修改后保存并重启 addon 生效。
options:
  LOW_MEMORY: true
  ATV_DEBUG: false
  AUTO_UPDATE: true
schema:
  LOW_MEMORY: bool?
  ATV_DEBUG: bool?
  AUTO_UPDATE: bool?
  JVM_OPTS: str?
map:
  - type: app_config
    path: /config
    read_only: false
  - type: homeassistant_config
    path: /legacy_ha
    read_only: false
startup: application
boot: manual

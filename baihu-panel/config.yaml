name: 白虎面板
slug: baihu-panel
version: "1.6.3-build.9"
image: ghcr.io/solarflows/baihu-panel
description: "轻量级定时任务管理系统，支持 Python, Node.js, Go, Rust, PHP 等所有主流语言"
url: https://github.com/engigu/baihu-panel
init: false
arch:
  - aarch64
  - amd64
webui: "[PROTO:http]://[HOST]:[PORT:8052]"
ports:
  8052/tcp: 8052
ports_description:
  8052/tcp: 'Baihu Panel Web UI port'
# 可选配置项：修改后保存并重启 addon 生效。
options: {}
schema: {}
map:
  - type: app_config
    path: /app/data
    read_only: false
  - type: homeassistant_config
    path: /legacy_ha
    read_only: false
  - type: share
    path: /share
    read_only: false
startup: application
boot: manual
